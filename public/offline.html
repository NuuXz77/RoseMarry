<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koneksi Terputus - Rosemary POS</title>
    
    <!-- Tailwind CSS & DaisyUI CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.10.2/dist/full.min.css" rel="stylesheet" type="text/css" />
    
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        primary: '#FE6700', // Rosemary Brand Color
                    }
                }
            }
        }
    </script>
    
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
    </style>
</head>

<body class="bg-[#f0f2f5] text-[#1a1a1a] min-h-screen flex items-center justify-center p-6 selection:bg-primary selection:text-white overflow-hidden">
    
    <!-- Animated background blobs -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-primary/10 rounded-full blur-[120px]"></div>
        <div class="absolute top-[60%] -right-[10%] w-[50%] h-[50%] bg-primary/5 rounded-full blur-[120px]"></div>
    </div>

    <div class="max-w-md w-full relative z-10 animate-in fade-in zoom-in duration-700">
        <div class="glass-card rounded-[45px] p-10 shadow-[0_32px_64px_-16px_rgba(0,0,0,0.1)] text-center space-y-10 border-t border-l border-white/60">
            
            <!-- Branding Section -->
            <div class="flex flex-col items-center gap-2 mb-2">
                <div class="flex items-center gap-1.5">
                    <div class="w-3 h-3 rounded-full bg-primary animate-pulse"></div>
                    <span class="text-[10px] font-black uppercase tracking-[0.4em] text-slate-400">Rosemary POS</span>
                </div>
            </div>

            <!-- Icon Section -->
            <div class="flex justify-center pt-2">
                <div class="relative group">
                    <div class="absolute inset-0 bg-primary/30 rounded-full blur-2xl animate-pulse group-hover:bg-primary/40 transition-all duration-700"></div>
                    <div class="relative w-32 h-32 bg-gradient-to-br from-primary to-[#ff8533] rounded-[40px] flex items-center justify-center shadow-[0_25px_50px_-12px_rgba(254,103,0,0.4)] animate-float">
                        <img src="img/logo.png" alt="Rosemary Logo" class="w-16 h-16">
                    </div>
                    
                    <!-- Small Status Indicator -->
                    <div class="absolute -bottom-2 -right-2 bg-white p-2.5 rounded-2xl shadow-xl border border-slate-100">
                        <div class="w-5 h-5 bg-error rounded-full animate-ping opacity-75"></div>
                        <div class="absolute top-2.5 left-2.5 w-5 h-5 bg-error rounded-full flex items-center justify-center">
                            <span class="w-2 h-0.5 bg-white rounded-full"></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Content -->
            <div class="space-y-4">
                <h1 class="text-3xl font-black tracking-tight text-slate-900 leading-tight">
                    Ups! Koneksi <br> <span class="text-primary italic">Terputus</span>
                </h1>
                <p class="text-slate-500 font-medium leading-relaxed px-4">
                    Sepertinya kamu sedang offline. Periksa kembali Wi-Fi atau data seluler kamu ya.
                </p>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-col gap-4 pt-2">
                <button onclick="window.location.reload()" class="btn h-16 bg-primary border-none hover:bg-[#e55c00] text-white rounded-[24px] shadow-2xl shadow-primary/40 gap-3 group transition-all active:scale-95">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 group-hover:rotate-180 transition-transform duration-700" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    <span class="text-lg font-bold">Coba Lagi</span>
                </button>
                <a href="/" class="btn btn-ghost h-14 rounded-[24px] text-slate-400 hover:text-primary hover:bg-primary/5">
                    Kembali ke Beranda
                </a>
            </div>

            <!-- Status Badge -->
            <div class="pt-2">
                <div class="inline-flex items-center gap-2 px-5 py-2.5 rounded-full bg-slate-100/50 border border-slate-200">
                    <div class="w-2 h-2 rounded-full bg-slate-300"></div>
                    <span class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400">Offline Mode Active</span>
                </div>
            </div>
        </div>
        
        <p class="text-center mt-12 text-[10px] font-bold text-slate-400 uppercase tracking-[0.3em]">
            &copy; 2024 Rosemary - Advanced POS System
        </p>
    </div>

    <script>
        // Reload page automatically when back online
        window.addEventListener('online', () => {
            console.log('Koneksi kembali! Memuat ulang...');
            window.location.reload();
        });

        // Simple check to see if we're actually back online
        setInterval(() => {
            if (navigator.onLine) {
                // If the browser reports online, but we're still on this page
                // It might be worth trying a reload
            }
        }, 5000);
    </script>
</body>

</html>
